<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{

}
header{
  background:linear-gradient(135deg,#1b5e20,#4caf50);
  color:white;
  padding:50px 20px;
  text-align:center;
  border-bottom-left-radius:50px;
  border-bottom-right-radius:50px;
  position:relative;
  overflow:hidden;
}
header::after{
  content:"";
  background:url('header-bg.png') center/cover no-repeat;
  opacity:0.15;
  top:0; left:0; bottom:0; right:0;
  position:absolute;
  z-index:0;
}
header h1, header p, .nav{position:relative; z-index:1;}
header h1{font-size:40px;margin-bottom:10px;}
header p{font-size:18px;opacity:0.9;}

.nav{margin-top:15px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;}
.nav a{background:rgba(255,255,255,0.2);color:white;padding:8px 16px;border-radius:25px;text-decoration:none;font-weight:bold;}

.motivation{
  text-align:center;
  margin:30px auto 10px auto;
  font-size:19px;
  color:#1b5e20;
  font-weight:bold;
}

.container{
  max-width:800px;
  margin:auto;
  padding:20px 20px 40px 20px;
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  flex-wrap:wrap;
  gap:10px;
}
.timer-circle{
  width:80px;height:80px;border-radius:50%;
  border:6px solid #1b5e20;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:bold;
  background:#e8f5e9;
}
.timer-circle.danger{border-color:red;color:red;animation:shake 0.4s infinite;}
@keyframes shake{0%{transform:rotate(0deg);}25%{transform:rotate(3deg);}50%{transform:rotate(0deg);}75%{transform:rotate(-3deg);}100%{transform:rotate(0deg);}}

.score-bar{
  background:#1b5e20;color:white;padding:10px 20px;
  border-radius:15px;font-weight:bold;
}
.progress-bar{
  background:#c8e6c9;border-radius:15px;
  padding:8px 20px;font-weight:bold;color:#1b5e20;
}

.ayah-card{
  background:white;
  border-radius:25px;
  padding:35px 25px;
  box-shadow:0 8px 20px rgba(0,0,0,0.15);
  text-align:center;
}
.ayah-card h3{
  color:#1b5e20;
  margin-bottom:20px;
  font-size:18px;
}
.ayah-text{
  font-family:'Amiri', serif;
  font-size:26px;
  line-height:2.2;
  color:#1b5e20;
  margin-bottom:25px;
}
.blank{
  display:inline-block;
  min-width:90px;
  border-bottom:3px dashed #4caf50;
  color:#e53935;
  font-weight:bold;
}

.options{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  margin-top:20px;
}
.option-btn{
  padding:14px;
  border:none;
  border-radius:20px;
  background:#e0f2f1;
  cursor:pointer;
  font-size:17px;
  font-family:'Amiri', serif;
  transition:0.25s;
}
.option-btn:hover{background:#c8e6c9;transform:translateY(-2px);}
.option-btn.correct{background:#4caf50;color:white;}
.option-btn.wrong{background:#f44336;color:white;}

.result{
  margin-top:18px;
  font-size:19px;
  font-weight:bold;
  min-height:26px;
}
.level-badge{background:#7b1fa2;color:white;padding:8px 16px;border-radius:15px;font-weight:bold;font-size:14px;}
.level-up-banner{
  background:linear-gradient(135deg,#7b1fa2,#ab47bc);
  color:white;
  text-align:center;
  padding:12px;
  border-radius:15px;
  margin-bottom:15px;
  font-weight:bold;
  font-size:18px;
  animation:popIn 0.5s;
}
@keyframes popIn{0%{transform:scale(0.7);opacity:0;}100%{transform:scale(1);opacity:1;}}

.final-card{
  background:linear-gradient(135deg,#e8f5e9,#ffffff);
  border-radius:25px;
  padding:35px;
  box-shadow:0 8px 20px rgba(0,0,0,0.15);
  text-align:center;
}
.final-score{font-size:42px;color:#1b5e20;margin:15px 0;}

.share-box{margin-top:20px;display:flex;justify-content:center;gap:15px;}
.share-box a{font-size:22px;color:white;width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:50%;text-decoration:none;}
.whatsapp{background:#25D366;}
.facebook{background:#1877f2;}
.copy{background:#4caf50;}

.restart-btn,.exit-btn{

  padding:13px 26px;
  border:none;
  border-radius:25px;
  cursor:pointer;
  font-size:16px;
  margin-inline:5px;

.restart-btn{background:#1b5e20;color:white;}
.exit-btn{background:#f44336;color:white;}

@media(max-width:600px){
  .options{grid-template-columns:1fr;}
  header h1{font-size:28px;}
  .ayah-text{font-size:21px;}

    after: "﴾",
    missing: "بِالْمُهْتَدِينَ",
    options: ["بِالْمُهْتَدِينَ", "بِالْمُتَّقِينَ", "بِالصَّابِرِينَ", "بِالْمُحْسِنِينَ"],
    surah: "سورة النحل",
    ayah: 125,
    difficulty: "hard"
  },
  {

    after: "بِمَا تَعْمَلُونَ﴾",

  },
  {

    after: "وَكَبِّرْهُ تَكْبِيرًا﴾",
    missing: "الذُّلِّ",
    options: ["الضَّعْفِ", "الذُّلِّ", "الْفَقْرِ", "الْعَجْزِ"],

    after: "﴾",
    missing: "عَلِيمًا",
    options: ["عَلِيمًا", "خَبِيرًا", "بَصِيرًا", "شَهِيدًا"],
    surah: "سورة الأحزاب",
    ayah: 40,
    difficulty: "hard"
  },
  {
    before: "﴿مَا عِندَكُمْ يَنفَدُ وَمَا عِندَ اللَّهِ بَاقٍ وَلَنَجْزِيَنَّ الَّذِينَ صَبَرُوا أَجْرَهُم بِأَحْسَنِ مَا كَانُوا",
    after: "﴾",
    missing: "يَعْمَلُونَ",
    options: ["يَعْمَلُونَ", "يَصْنَعُونَ", "يَكْسِبُونَ", "يَفْعَلُونَ"],
    surah: "سورة النحل",
    ayah: 96,
    difficulty: "hard"
  }

];

let questions=[],current=0,score=0,timeLeft=20,timer,totalQuestions=30,level=1;

function getLevelConfig(qIndex){

// الأسئلة 1 - 10
if(qIndex < 10){
  return {
    level:1,
    time:20,
    points:10
  };
}

// الأسئلة 11 - 20
if(qIndex < 20){
  return {
    level:2,
    time:15,
    points:15
  };
}

// الأسئلة 21 - 30
return {
  level:3,
  time:10,
  points:20
};
}

function shuffle(a){return a.sort(()=>Math.random()-0.5);}

function startGame(){
  const easyQ = shuffle(originalQuestions.filter(q => q.difficulty === "easy"));
  const mediumQ = shuffle(originalQuestions.filter(q => q.difficulty === "medium"));
  const hardQ = shuffle(originalQuestions.filter(q => q.difficulty === "hard"));

  questions = [
    ...easyQ.slice(0, 10),
    ...mediumQ.slice(0, 10),
    ...hardQ.slice(0, 10)
  ];

  current=0;score=0;level=1;
  document.getElementById("qTotal").textContent=questions.length;
  showQuestion();
}

function renderCard(){
  document.getElementById("gameCard").innerHTML=`
    <h3 id="surahName"></h3>
    <div class="ayah-text" id="ayahText"></div>
    <div class="options" id="options"></div>
    <div class="result" id="result"></div>
  `;
}

function showQuestion(){
  if(current>=questions.length){endGame();return;}
  renderCard();
  const cfg=getLevelConfig(current);
  const levelChanged = cfg.level!==level;
  level=cfg.level;
  timeLeft=cfg.time;
  document.getElementById("time").classList.remove("danger");
  document.getElementById("time").textContent=timeLeft;
  document.getElementById("score").textContent=score;
  document.getElementById("qNum").textContent=current+1;
  document.getElementById("level").textContent=level;

  const q=questions[current];
  document.getElementById("surahName").textContent =
`📍 ${q.surah} • الآية ${q.ayah}` +
(levelChanged ? " — 🎯 مستوى جديد! سرعة أكبر ونقاط أعلى" : "");
  document.getElementById("ayahText").innerHTML=
    q.before+' <span class="blank">؟؟؟؟</span> '+q.after;

  const optDiv=document.getElementById("options");
  optDiv.innerHTML="";
  shuffle([...q.options]).forEach(o=>{
    const b=document.createElement("button");
    b.textContent=o;
    b.className="option-btn";
    b.onclick=()=>checkAnswer(o,b);
    optDiv.appendChild(b);
  });
  startTimer();
}

function startTimer(){
  clearInterval(timer);
  timer=setInterval(()=>{
    timeLeft--;
    document.getElementById("time").textContent=timeLeft;
    if(timeLeft<=5) document.getElementById("time").classList.add("danger");
    if(timeLeft<=0){clearInterval(timer);checkAnswer(null,null);}
  },1000);
}

function checkAnswer(selected,btnEl){
  clearInterval(timer);
  const q=questions[current];
  const btns=document.querySelectorAll(".option-btn");
  btns.forEach(b=>{
    b.disabled=true;
    if(b.textContent===q.missing) b.classList.add("correct");
  });
  if(selected===q.missing){
    score+=getLevelConfig(current).points;
    soundCorrect.play();
    document.getElementById("result").textContent="✅ إجابة صحيحة!";
    document.getElementById("ayahText").innerHTML = q.before+' <span class="blank" style="color:#1b5e20;">'+q.missing+'</span> '+q.after;
  }else{
    if(btnEl) btnEl.classList.add("wrong");
    soundWrong.play();
    document.getElementById("result").textContent="❌ الإجابة الصحيحة: "+q.missing;
    document.getElementById("ayahText").innerHTML = q.before+' <span class="blank" style="color:#1b5e20;">'+q.missing+'</span> '+q.after;
  }
  document.getElementById("score").textContent=score;
  setTimeout(()=>{current++;showQuestion();},1800);
}

function endGame(){
  let max=0;
  for(let i=0;i<questions.length;i++) max+=getLevelConfig(i).points;
  let msg="";
  if(score>=max*0.8){msg="🌟 ما شاء الله! حفظ رائع للآيات!";soundWin.play();}
  else if(score>=max*0.5){msg="👏 أداء جيد، واصل المراجعة!";soundWin.play();}
  else{msg="🌱 حاول مرة أخرى وستتحسن بإذن الله!";soundLose.play();}

  document.getElementById("gameCard").innerHTML=`
  <div class="final-card">
    <h2>🎉 انتهت اللعبة</h2>
    <div class="final-score">${score} / ${max}</div>
    <p>${msg}</p>
    <div class="share-box">
      <a class="whatsapp" target="_blank" href="https://wa.me/?text=حصلت على ${score}/${max} في لعبة أكمل الآية 📖 جربها: ${siteLink}"><i class="fab fa-whatsapp"></i></a>
      <a class="facebook" target="_blank" href="https://www.facebook.com/sharer/sharer.php?u=${siteLink}"><i class="fab fa-facebook-f"></i></a>
      <a class="copy" onclick="copyResult(${score},${max})"><i class="fa fa-link"></i></a>
    </div>
    <div>
      <button class="restart-btn" onclick="startGame()">🔄 إعادة اللعبة</button>
      <button class="exit-btn" onclick="location.href='games.html'">🚪 الخروج للألعاب</button>
    </div>
  </div>`;
}

function copyResult(score,max){
  navigator.clipboard.writeText(`حصلت على ${score}/${max} في لعبة أكمل الآية 📖 جربها الآن: ${siteLink}`);
  alert("تم النسخ ✔");
}

startGame();
</script>
