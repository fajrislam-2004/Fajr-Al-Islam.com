<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Cairo',sans-serif;
  background:linear-gradient(to bottom,#e8f5e9,#ffffff);
  color:#2f4f4f;
  line-height:1.7;
}
a{text-decoration:none;color:inherit}

/* Header */
header{
  background:linear-gradient(135deg,#1b5e20,#4caf50);
  color:white;
  padding:50px 20px 80px 20px;
  text-align:center;
  border-bottom-left-radius:50px;
  border-bottom-right-radius:50px;
  position:relative;
  overflow:hidden;
}
header::after{
  content:"";
  background:url('ayah.png') center/cover no-repeat;
  opacity:0.15;
  top:0; left:0; bottom:0; right:0;
  position:absolute;
  z-index:0;
}
header h1, header p, .nav{
  position:relative;
  z-index:1;
}
header h1{font-size:38px;margin-bottom:10px;}
header p{font-size:18px;opacity:0.9;}

/* Navigation */
.nav{margin-top:20px;display:flex;justify-content:center;flex-wrap:wrap;gap:10px;}
.nav a{background:rgba(255,255,255,0.2);color:white;font-weight:bold;padding:8px 16px;border-radius:25px;transition:0.3s;}
.nav a:hover{background:white;color:#1b5e20;}

/* Container */
.container{
  max-width:900px;
  margin:auto;
  padding:30px 15px;
}

/* Ayah card */
.ayah-card{
  background:linear-gradient(145deg,#ffffff,#e0f2f1);
  border-radius:25px;
  box-shadow:0 12px 20px rgba(0,0,0,0.15);
  padding:25px 18px;
  text-align:center;
  position:relative;
  transition:opacity 0.5s;
}
.ayah-card.fade{opacity:0;}

/* Text */
.ayah-text{
  font-size:26px;
  color:#1b5e20;
  margin-bottom:15px;
  font-weight:700;
}
.tafseer{
  font-size:17px;
  margin-bottom:15px;
}
.surah-ref{
  font-size:14px;
  color:white;
  background:linear-gradient(135deg,#1b5e20,#4caf50);
  display:inline-block;
  padding:5px 16px;
  border-radius:15px;
  margin-bottom:15px;
  font-weight:bold;
}

/* Action buttons */
.action-buttons{
  display:flex;
  justify-content:center;
  gap:25px; /* مسافة أكبر بين الأزرار */
  margin-top:25px;
  flex-wrap:wrap;
}

.action-buttons button{
  flex:1;
  max-width:180px;
  background:linear-gradient(135deg,#1b5e20,#4caf50);
  color:white;
  border:none;
  padding:12px 18px;
  font-size:16px;
  border-radius:25px;
  cursor:pointer;
  box-shadow:0 6px 12px rgba(0,0,0,0.15);
  transition:all 0.3s ease;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}
.action-buttons button:hover{
  transform:translateY(-4px) scale(1.05);
  box-shadow:0 12px 20px rgba(0,0,0,0.25);
  background:linear-gradient(135deg,#4caf50,#81c784);
}

/* Share buttons */
.share-buttons{
  display:flex;
  justify-content:center;
  gap:20px; /* مسافة أكبر بين أيقونات المشاركة */
  margin-top:20px;
  flex-wrap:wrap;
}
.share-buttons a{
  color:white;
  padding:10px 16px;
  border-radius:20px;
  font-size:15px;
  display:flex;
  align-items:center;
  gap:6px;
  transition:all 0.3s ease;
  box-shadow:0 4px 8px rgba(0,0,0,0.15);
}
#share-whatsapp{background:#25D366;}
#share-facebook{background:#3b5998;}
#share-instagram{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);}
.share-buttons a:hover{
  transform:translateY(-3px) scale(1.05);
  opacity:0.85;
}

/* Footer */
footer{
  background:#1b5e20;
  color:white;
  text-align:center;
  padding:15px;
  margin-top:40px;
  border-top-left-radius:25px;
  border-top-right-radius:25px;
}
footer small{opacity:0.7}

/* Responsive */
@media (max-width:600px){
  header{
    padding:30px 15px 50px 15px;
    border-bottom-left-radius:30px;
    border-bottom-right-radius:30px;
  }
  header h1{font-size:26px;margin-bottom:6px;}
  header p{font-size:14px;}

  .nav{gap:6px;margin-top:15px;}
  .nav a{padding:5px 10px;font-size:12px;}

  .container{padding:20px 12px;}
  .ayah-card{padding:20px 14px;border-radius:18px;}
  .ayah-text{font-size:20px;}
  .tafseer{font-size:14px;}
  .surah-ref{font-size:12px;}
  button{width:100%;}
  .action-buttons{gap:12px;}
  .action-buttons button{flex:1;justify-content:center;font-size:14px;padding:10px 12px;}
  .share-buttons a{flex:1;justify-content:center;font-size:13px;padding:8px 10px;}

  footer{
    padding:16px 15px;
    margin-top:30px;
    border-top-left-radius:20px;
    border-top-right-radius:20px;
  }
  footer p{font-size:13px;margin-bottom:4px;}
  footer small{font-size:11px;display:block;line-height:1.5;}
}
</style>
</head>

<script>
const ayat=[
{text:"﴿إِنَّ اللَّهَ مَعَ الصَّابِرِينَ﴾",surah:"سورة البقرة - الآية 153",tafseer:"الصبر مفتاح الفرج، ومن صبر على أقدار الله وطاعته كان الله معه بالنصر والتوفيق والمعية الخاصة."},
{text:"﴿فَاذْكُرُونِي أَذْكُرْكُمْ وَاشْكُرُوا لِي وَلَا تَكْفُرُونِ﴾",surah:"سورة البقرة - الآية 152",tafseer:"ذكر الله يطمئن القلب ويرفع الدرجة، ومن ذكر الله ذكره الله في الملأ الأعلى، وشكر النعمة سبب لدوامها وزيادتها."},
{text:"﴿فَإِنَّ مَعَ الْعُسْرِ يُسْرًا ﴿٥﴾ إِنَّ مَعَ الْعُسْرِ يُسْرًا﴾",surah:"سورة الشرح - الآيتان 5-6",tafseer:"تكرار الآية للتأكيد أن مع كل صعوبة يسراً، فلا ييأس المؤمن مهما اشتدت به الأحوال."},
{text:"﴿وَعَسَىٰ أَن تَكْرَهُوا شَيْئًا وَهُوَ خَيْرٌ لَّكُمْ﴾",surah:"سورة البقرة - الآية 216",tafseer:"قد يقدّر الله للعبد أمراً يكرهه في ظاهره، وفيه خير عظيم له لا يعلمه، فليحسن العبد الظن بربه."},
{text:"﴿وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا ﴿٢﴾ وَيَرْزُقْهُ مِنْ حَيْثُ لَا يَحْتَسِبُ﴾",surah:"سورة الطلاق - الآيتان 2-3",tafseer:"تقوى الله سبب لكل فرج ومخرج من الضيق، والرزق يأتي من حيث لا يتوقع العبد، فمن اتقى الله كفاه."},
{text:"﴿فَإِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى اللَّهِ إِنَّ اللَّهَ يُحِبُّ الْمُتَوَكِّلِينَ﴾",surah:"سورة آل عمران - الآية 159",tafseer:"التوكل على الله بعد الأخذ بالأسباب من صفات المؤمنين المحبوبين عند الله، وهو طمأنينة القلب بأن الله كافٍ عبده."},
{text:"﴿لَئِن شَكَرْتُمْ لَأَزِيدَنَّكُمْ﴾",surah:"سورة إبراهيم - الآية 7",tafseer:"شكر النعم سبب مباشر لزيادتها من الله، فكلما شكر العبد ربه على نعمه زاده الله من فضله."},
{text:"﴿وَمَن يَعْمَلْ سُوءًا أَوْ يَظْلِمْ نَفْسَهُ ثُمَّ يَسْتَغْفِرِ اللَّهَ يَجِدِ اللَّهَ غَفُورًا رَّحِيمًا﴾",surah:"سورة النساء - الآية 110",tafseer:"باب التوبة والاستغفار مفتوح دائماً، ومن أذنب ثم استغفر ربه بصدق وجد الله غفوراً رحيماً به."},
{text:"﴿قُلْ يَا عِبَادِيَ الَّذِينَ أَسْرَفُوا عَلَىٰ أَنفُسِهِمْ لَا تَقْنَطُوا مِن رَّحْمَةِ اللَّهِ ۚ إِنَّ اللَّهَ يَغْفِرُ الذُّنُوبَ جَمِيعًا﴾",surah:"سورة الزمر - الآية 53",tafseer:"مهما كثرت ذنوب العبد فلا ييأس من رحمة الله الواسعة، فرحمته سبحانه تسع كل ذنب لمن تاب وأناب."},
{text:"﴿ادْعُونِي أَسْتَجِبْ لَكُمْ﴾",surah:"سورة غافر - الآية 60",tafseer:"وعد من الله بإجابة الدعاء، فليكثر المؤمن من دعاء ربه في كل أحواله بيقين واستحضار قلب."},
{text:"﴿وَإِذَا سَأَلَكَ عِبَادِي عَنِّي فَإِنِّي قَرِيبٌ ۖ أُجِيبُ دَعْوَةَ الدَّاعِ إِذَا دَعَانِ﴾",surah:"سورة البقرة - الآية 186",tafseer:"الله قريب من عباده يسمع دعاءهم ويجيبهم، فلا حاجة لواسطة بين العبد وربه في الدعاء."},
{text:"﴿أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ﴾",surah:"سورة الرعد - الآية 28",tafseer:"لا سعادة ولا طمأنينة حقيقية للقلب إلا بذكر الله سبحانه، فذكره غذاء الأرواح وراحة القلوب."},
{text:"﴿وَقُل رَّبِّ زِدْنِي عِلْمًا﴾",surah:"سورة طه - الآية 114",tafseer:"دعاء علّمه الله لنبيه ﷺ يدل على فضل طلب العلم وأنه لا حد لطلبه، فينبغي للمسلم أن يسأل الله المزيد منه دوماً."},
{text:"﴿وَقَضَىٰ رَبُّكَ أَلَّا تَعْبُدُوا إِلَّا إِيَّاهُ وَبِالْوَالِدَيْنِ إِحْسَانًا﴾",surah:"سورة الإسراء - الآية 23",tafseer:"قرن الله بر الوالدين بتوحيده وعبادته، مما يدل على عظم منزلة البر بهما في الإسلام."},
{text:"﴿وَلَا تُصَعِّرْ خَدَّكَ لِلنَّاسِ وَلَا تَمْشِ فِي الْأَرْضِ مَرَحًا ۖ إِنَّ اللَّهَ لَا يُحِبُّ كُلَّ مُخْتَالٍ فَخُورٍ﴾",surah:"سورة لقمان - الآية 18",tafseer:"وصية لقمان لابنه بالتواضع مع الناس وعدم التكبر عليهم، فالله لا يحب المتكبرين المتباهين."},
{text:"﴿إِنَّ أَكْرَمَكُمْ عِندَ اللَّهِ أَتْقَاكُمْ﴾",surah:"سورة الحجرات - الآية 13",tafseer:"ميزان التفاضل بين الناس عند الله هو التقوى لا النسب ولا المال ولا اللون، فأكرم الناس أتقاهم لله."},
{text:"﴿مَنْ عَمِلَ صَالِحًا مِّن ذَكَرٍ أَوْ أُنثَىٰ وَهُوَ مُؤْمِنٌ فَلَنُحْيِيَنَّهُ حَيَاةً طَيِّبَةً﴾",surah:"سورة النحل - الآية 97",tafseer:"العمل الصالح المقرون بالإيمان سبب لحياة طيبة سعيدة في الدنيا، بغض النظر عن جنس العامل ذكراً كان أو أنثى."},
{text:"﴿مَّنْ عَمِلَ صَالِحًا فَلِنَفْسِهِ ۖ وَمَنْ أَسَاءَ فَعَلَيْهَا﴾",surah:"سورة فصلت - الآية 46",tafseer:"ثمرة العمل الصالح أو السيئ تعود على صاحبها وحده، فلا يتحمل أحد وزر أحد، وهذا من عدل الله سبحانه."},
{text:"﴿وَلَا تَهِنُوا وَلَا تَحْزَنُوا وَأَنتُمُ الْأَعْلَوْنَ إِن كُنتُم مُّؤْمِنِينَ﴾",surah:"سورة آل عمران - الآية 139",tafseer:"نهي عن الضعف والحزن عند الشدائد، فالعلو الحقيقي للمؤمنين الصادقين مهما مرّوا بمحن مؤقتة."},
{text:"﴿وَاسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ﴾",surah:"سورة البقرة - الآية 45",tafseer:"الصبر والصلاة سلاح المؤمن في مواجهة صعوبات الحياة، فمن استعان بهما هانت عليه الأمور."},
{text:"﴿إِنَّهُ لَا يَيْأَسُ مِن رَّوْحِ اللَّهِ إِلَّا الْقَوْمُ الْكَافِرُونَ﴾",surah:"سورة يوسف - الآية 87",tafseer:"اليأس من رحمة الله وفرجه من صفات الكافرين، أما المؤمن فيبقى متفائلاً راجياً رحمة ربه مهما طال الانتظار."},
{text:"﴿وَلْيَعْفُوا وَلْيَصْفَحُوا ۗ أَلَا تُحِبُّونَ أَن يَغْفِرَ اللَّهُ لَكُمْ﴾",surah:"سورة النور - الآية 22",tafseer:"دعوة للعفو والصفح عمن أساء، وربط ذلك برغبة العبد في مغفرة الله له، فالجزاء من جنس العمل."},
{text:"﴿خُذِ الْعَفْوَ وَأْمُرْ بِالْعُرْفِ وَأَعْرِضْ عَنِ الْجَاهِلِينَ﴾",surah:"سورة الأعراف - الآية 199",tafseer:"منهج قرآني في التعامل مع الناس: التسامح، والدعوة بالمعروف، والإعراض عن السفهاء دون الانجرار لمهاترتهم."},
{text:"﴿يَا أَيُّهَا النَّاسُ أَنتُمُ الْفُقَرَاءُ إِلَى اللَّهِ ۖ وَاللَّهُ هُوَ الْغَنِيُّ الْحَمِيدُ﴾",surah:"سورة فاطر - الآية 15",tafseer:"تذكير للبشر جميعاً بحقيقة افتقارهم الدائم لله في كل شؤونهم، بينما الله غني عن خلقه محمود في ذاته وأفعاله."},
{text:"﴿الَّذِي خَلَقَ الْمَوْتَ وَالْحَيَاةَ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلًا﴾",surah:"سورة الملك - الآية 2",tafseer:"الحياة الدنيا دار اختبار وابتلاء، والمقصود منها ليس كثرة العمل بل إحسانه وإخلاصه لله."},
{text:"﴿وَتَزَوَّدُوا فَإِنَّ خَيْرَ الزَّادِ التَّقْوَىٰ﴾",surah:"سورة البقرة - الآية 197",tafseer:"كما يتزود المسافر لسفره الدنيوي، ينبغي أن يتزود العبد للآخرة بالتقوى، فهي خير زاد يقدّمه العبد بين يدي ربه."},
{text:"﴿وَفِي السَّمَاءِ رِزْقُكُمْ وَمَا تُوعَدُونَ﴾",surah:"سورة الذاريات - الآية 22",tafseer:"الرزق مقدّر من عند الله من فوق، فلا يقلق العبد على رزقه بل يسعى ويأخذ بالأسباب متوكلاً على ربه."},
{text:"﴿وَاعْبُدُوا اللَّهَ وَلَا تُشْرِكُوا بِهِ شَيْئًا وَبِالْوَالِدَيْنِ إِحْسَانًا﴾",surah:"سورة النساء - الآية 36",tafseer:"الآية تجمع بين أعظم حق (توحيد الله) وأعظم حق بعده بين الناس (بر الوالدين)، فهما مقترنان في كثير من آيات القرآن."}
, {text:"﴿لَا تَقْنَطُوا مِن رَّحْمَةِ اللَّهِ﴾",surah:"سورة الزمر - الآية 53",tafseer:"تذكير للمؤمن بأن رحمة الله أوسع من اليأس، وأن باب التوبة مفتوح لمن رجع إلى الله وأناب."}
, {text:"﴿وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ﴾",surah:"سورة الطلاق - الآية 3",tafseer:"من صدق توكله على الله كفاه الله ما أهمّه، مع الأخذ بالأسباب المشروعة وعدم ترك العمل."}
, {text:"﴿إِنَّ مَعِيَ رَبِّي سَيَهْدِينِ﴾",surah:"سورة الشعراء - الآية 62",tafseer:"قالها موسى عليه السلام في أشد لحظات الخوف، فكان يقينه بالله أقوى من الخطر الذي أمامه."}
, {text:"﴿وَلَا تَيْأَسُوا مِن رَّوْحِ اللَّهِ﴾",surah:"سورة يوسف - الآية 87",tafseer:"المؤمن لا يغلق باب الأمل، بل يبقى راجياً فرج الله ورحمته مهما طال البلاء."}
, {text:"﴿وَقُلْ رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا﴾",surah:"سورة الإسراء - الآية 24",tafseer:"دعاء عظيم للوالدين يجمع الاعتراف بفضلهما وطلب الرحمة لهما، وهو من أجمل صور البر."}
, {text:"﴿إِنَّ اللَّهَ يُحِبُّ التَّوَّابِينَ وَيُحِبُّ الْمُتَطَهِّرِينَ﴾",surah:"سورة البقرة - الآية 222",tafseer:"من رحمة الله أنه لا يكتفي بقبول التوبة، بل يحب عباده الذين يكثرون الرجوع إليه ويتطهرون."}
, {text:"﴿وَاللَّهُ مَعَ الصَّابِرِينَ﴾",surah:"سورة الأنفال - الآية 46",tafseer:"الثبات والصبر من أسباب معية الله الخاصة لعباده، ولذلك لا يضيع تعب الصابر عند الله."}
, {text:"﴿إِنَّ اللَّهَ لَا يُضِيعُ أَجْرَ الْمُحْسِنِينَ﴾",surah:"سورة التوبة - الآية 120",tafseer:"كل إحسان يفعله العبد محفوظ عند الله، فلا يظن أن معروفه أو تضحيته ذهبت سدى."}
, {text:"﴿وَاللَّهُ خَيْرٌ حَافِظًا وَهُوَ أَرْحَمُ الرَّاحِمِينَ﴾",surah:"سورة يوسف - الآية 64",tafseer:"الله خير من يُستودع عنده، وحفظه لعبده أرحم وأكمل من كل حفظ، ولذلك يطمئن القلب إلى رعايته."}
, {text:"﴿وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مِنْ أَمْرِهِ يُسْرًا﴾",surah:"سورة الطلاق - الآية 4",tafseer:"التقوى سبب للتيسير، فمن راقب الله واتقاه جعل الله له من الصعوبات فرجاً ومن العسر يسراً."}
, {text:"﴿وَاصْبِرْ وَمَا صَبْرُكَ إِلَّا بِاللَّهِ﴾",surah:"سورة النحل - الآية 127",tafseer:"الصبر الحقيقي يستمد قوته من الله، فيستعين به العبد ولا يعتمد على قدرته وحدها."}
, {text:"﴿إِنَّ اللَّهَ لَا يُغَيِّرُ مَا بِقَوْمٍ حَتَّىٰ يُغَيِّرُوا مَا بِأَنفُسِهِمْ﴾",surah:"سورة الرعد - الآية 11",tafseer:"في الآية تذكير بأهمية إصلاح النفس والعمل؛ فالتغيير الإيجابي يبدأ من داخل الإنسان."}
, {text:"﴿فَاذْكُرُونِي أَذْكُرْكُمْ﴾",surah:"سورة البقرة - الآية 152",tafseer:"ذكر العبد لربه من أعظم أسباب شرفه وطمأنينته، ومن كرم الله أن يجازي ذكر عبده بذكره."}
, {text:"﴿وَمَن يَغْفِرُ الذُّنُوبَ إِلَّا اللَّهُ﴾",surah:"سورة آل عمران - الآية 135",tafseer:"المؤمن إذا زلّ لا يصر على الذنب، بل يتذكر عفو الله ويسارع إلى التوبة والاستغفار."}
, {text:"﴿وَإِن تَعُدُّوا نِعْمَتَ اللَّهِ لَا تُحْصُوهَا﴾",surah:"سورة إبراهيم - الآية 34",tafseer:"نعم الله على عباده كثيرة لا يمكن عدها، ومن أعظم ما يحيي القلب أن يتذكر نعمه ويشكره عليها."}
, {text:"﴿وَمَا تَوْفِيقِي إِلَّا بِاللَّهِ ۚ عَلَيْهِ تَوَكَّلْتُ وَإِلَيْهِ أُنِيبُ﴾",surah:"سورة هود - الآية 88",tafseer:"التوفيق بيد الله، ولذلك يجمع المؤمن بين الاعتماد على ربه والرجوع إليه في كل أمر."}
, {text:"﴿إِنَّ رَبِّي قَرِيبٌ مُّجِيبٌ﴾",surah:"سورة هود - الآية 61",tafseer:"يبعث هذا الختام في القلب أملاً عظيماً: فالله قريب من عباده، يسمع دعاءهم ويجيب من دعاه."}
, {text:"﴿وَلَا تَهِنُوا فِي ابْتِغَاءِ الْقَوْمِ ۖ إِن تَكُونُوا تَأْلَمُونَ فَإِنَّهُمْ يَأْلَمُونَ كَمَا تَأْلَمُونَ وَتَرْجُونَ مِنَ اللَّهِ مَا لَا يَرْجُونَ﴾",surah:"سورة النساء - الآية 104",tafseer:"تذكير للمؤمن بأن الألم جزء من الطريق، لكن المؤمن يحمل معه رجاءً بالله وثواباً لا يملكه أهل الباطل."}
, {text:"﴿إِنَّ اللَّهَ مَعَ الَّذِينَ اتَّقَوا وَالَّذِينَ هُم مُّحْسِنُونَ﴾",surah:"سورة النحل - الآية 128",tafseer:"التقوى والإحسان من أعظم أسباب معية الله، وهي معية نصر وتأييد وحفظ."}
, {text:"﴿وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا﴾",surah:"سورة الطلاق - الآية 2",tafseer:"حين تضيق الطرق قد يأتي الفرج من طريق لم يخطر للعبد على بال؛ والتقوى من أعظم أسباب هذا المخرج."}
, {text:"﴿فَإِنِّي قَرِيبٌ أُجِيبُ دَعْوَةَ الدَّاعِ إِذَا دَعَانِ﴾",surah:"سورة البقرة - الآية 186",tafseer:"الله سبحانه قريب من عباده، والدعاء صلة مباشرة بين العبد وربه، ولذلك لا ينبغي للمؤمن أن يمل من الدعاء."}
, {text:"﴿وَسَارِعُوا إِلَىٰ مَغْفِرَةٍ مِّن رَّبِّكُمْ وَجَنَّةٍ عَرْضُهَا السَّمَاوَاتُ وَالْأَرْضُ﴾",surah:"سورة آل عمران - الآية 133",tafseer:"دعوة إلى المبادرة بالطاعات والتوبة، وعدم تأجيل الخير؛ فالجنة تستحق أن يُسابق إليها."}
, {text:"﴿إِنَّ الْحَسَنَاتِ يُذْهِبْنَ السَّيِّئَاتِ﴾",surah:"سورة هود - الآية 114",tafseer:"من رحمة الله أن الأعمال الصالحة سبب في تكفير السيئات، وفي ذلك فتح لباب الأمل والعمل الصالح."}
, {text:"﴿وَقُلْ رَبِّ اغْفِرْ وَارْحَمْ وَأَنتَ خَيْرُ الرَّاحِمِينَ﴾",surah:"سورة المؤمنون - الآية 118",tafseer:"دعاء جامع للمغفرة والرحمة، وهما من أعظم ما يحتاج إليه العبد في دنياه وآخرته."}
, {text:"﴿وَالْعَاقِبَةُ لِلتَّقْوَىٰ﴾",surah:"سورة طه - الآية 132",tafseer:"النهايات الطيبة تكون لأهل التقوى، ولذلك لا يقيس المؤمن نجاحه بما يراه عاجلاً فقط."}
, {text:"﴿إِنَّ اللَّهَ يُحِبُّ الْمُحْسِنِينَ﴾",surah:"سورة البقرة - الآية 195",tafseer:"الإحسان منزلة عظيمة تجمع إتقان العمل وإحسان التعامل، ومن أحبّه الله فقد نال خيراً عظيماً."}
, {text:"﴿وَاسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ ۚ إِنَّ اللَّهَ مَعَ الصَّابِرِينَ﴾",surah:"سورة البقرة - الآية 153",tafseer:"حين تثقل الحياة على القلب، يوجه القرآن إلى الصبر والصلاة، ويعد الصابرين بمعية الله."}
, {text:"﴿قُلْ إِنَّ صَلَاتِي وَنُسُكِي وَمَحْيَايَ وَمَمَاتِي لِلَّهِ رَبِّ الْعَالَمِينَ﴾",surah:"سورة الأنعام - الآية 162",tafseer:"غاية المؤمن أن تكون حياته كلها لله، في عبادته وعمله ونيته واختياراته، حتى يصبح القصد إلى الله حاضراً في كل شأن."}
, {text:"﴿إِنَّ الْإِنسَانَ لَيَطْغَىٰ ۝ أَن رَّآهُ اسْتَغْنَىٰ﴾",surah:"سورة العلق - الآيتان 6-7",tafseer:"تذكير بأن شعور الإنسان بالاستغناء قد يقوده إلى الطغيان، ولذلك يحتاج دائماً إلى استحضار فقره إلى الله."}
, {text:"﴿فَأَمَّا مَن أَعْطَىٰ وَاتَّقَىٰ ۝ وَصَدَّقَ بِالْحُسْنَىٰ ۝ فَسَنُيَسِّرُهُ لِلْيُسْرَىٰ﴾",surah:"سورة الليل - الآيات 5-7",tafseer:"العطاء والتقوى والتصديق بوعد الله من أسباب التيسير للخير، وفيها تشجيع على البذل والثقة بوعد الله."}
];

let history = [];
let current = Math.floor(Math.random() * ayat.length);

function updateShare(){
  const url = encodeURIComponent(location.href);
  // نص المشاركة: الآية + سطر فارغ + التفسير + سطر فارغ + اسم الصفحة
  const text = encodeURIComponent(
    ayat[current].text + "\n" +
    "(" + ayat[current].surah + ")" + "\n\n" +
    "وقفة تدبر: " + ayat[current].tafseer + "\n\n" +
    "آية وتدبر - فجر الإسلام"
  );

  document.getElementById("share-whatsapp").href = `https://wa.me/?text=${text}%0A${url}`;
  document.getElementById("share-facebook").href = `https://www.facebook.com/sharer/sharer.php?u=${url}&quote=${text}`;
  // تم استبدال تويتر بزر انستقرام (يعمل عبر shareInstagram)
}

function showAyah(index){
  const card = document.getElementById("ayahCard");
  card.classList.add("fade");
  setTimeout(() => {
    current = index;
    document.getElementById("ayah").innerText = ayat[current].text;
    document.getElementById("surahRef").innerText = ayat[current].surah;
    document.getElementById("tafseer").innerText = "وقفة تدبر: " + ayat[current].tafseer;
    updateShare();
    card.classList.remove("fade");
  }, 300);
}

function nextAyah(){
  history.push(current);
  let newIndex;
  do { newIndex = Math.floor(Math.random() * ayat.length); } while(newIndex === current);
  showAyah(newIndex);
}

function previousAyah(){
  if(history.length === 0) return;
  const lastIndex = history.pop();
  showAyah(lastIndex);
}

document.addEventListener("DOMContentLoaded", () => { showAyah(current); });

// مشاركة موحّدة عبر انستقرام
function shareInstagram(text){
  if(navigator.share){
    navigator.share({text:text}).catch(()=>{});
  } else {
    navigator.clipboard.writeText(text).then(()=>{
      alert('تم نسخ النص 📋 افتح تطبيق انستقرام والصقه في قصة أو منشور جديد');
      window.open('https://www.instagram.com/','_blank');
    }).catch(()=>{
      window.open('https://www.instagram.com/','_blank');
    });
  }
}

</script>
