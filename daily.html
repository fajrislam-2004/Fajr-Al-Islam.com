<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحدي الثواني - فجر الإسلام</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Cairo',sans-serif;
  background:linear-gradient(to bottom,#e8f5e9,#ffffff);
  color:#2f4f4f;
  min-height:100vh;
}
header{
  background:linear-gradient(135deg,#1b5e20,#4caf50);
  color:white;
  padding:50px 20px;
  text-align:center;
  border-bottom-left-radius:50px;
  border-bottom-right-radius:50px;
  position:relative;
  overflow:hidden;
}
header::after{
  content:"";
  background:url('header-bg.png') center/cover no-repeat;
  opacity:0.15;
  top:0; left:0; bottom:0; right:0;
  position:absolute;
  z-index:0;
}
header h1, header p, .nav{position:relative; z-index:1;}
header h1{font-size:38px;margin-bottom:10px;}
header p{font-size:17px;opacity:0.92;}
.nav{margin-top:15px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;}
.nav a{background:rgba(255,255,255,0.2);color:white;padding:8px 16px;border-radius:25px;text-decoration:none;font-weight:bold;}

.container{max-width:760px;margin:auto;padding:25px 20px 40px 20px;}

/* شريط الحالة العلوي */
.status-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:white;
  border-radius:20px;
  padding:14px 20px;
  box-shadow:0 4px 14px rgba(0,0,0,0.08);
  margin-bottom:20px;
  flex-wrap:wrap;
  gap:10px;
}
.hearts{font-size:22px;letter-spacing:4px;}
.heart-lost{opacity:0.25;filter:grayscale(1);}
.combo-box{
  background:linear-gradient(135deg,#1b5e20,#4caf50);
  color:white;
  padding:7px 16px;
  border-radius:15px;
  font-weight:bold;
  font-size:14px;
  transition:0.3s;
}
.combo-box.hot{
  background:linear-gradient(135deg,#e65100,#ff9800);
  animation:pulse 0.6s infinite;
}
@keyframes pulse{0%{transform:scale(1);}50%{transform:scale(1.08);}100%{transform:scale(1);}}
.score-box{font-weight:bold;color:#1b5e20;font-size:16px;}

/* شريط الوقت */
.timebar-wrap{
  background:#e0f2f1;
  border-radius:20px;
  height:14px;
  overflow:hidden;
  margin-bottom:22px;
}
.timebar{
  height:100%;
  background:linear-gradient(90deg,#4caf50,#81c784);
  width:100%;
  transition:width 1s linear, background 0.3s;
  border-radius:20px;
}
.timebar.danger{background:linear-gradient(90deg,#e53935,#ff8a65);}

/* بطاقة السؤال */
.q-card{
  background:white;
  border-radius:25px;
  padding:32px 24px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
  text-align:center;
}
.category-tag{
  display:inline-block;
  background:#e8f5e9;
  color:#1b5e20;
  padding:6px 16px;
  border-radius:15px;
  font-size:13px;
  font-weight:bold;
  margin-bottom:16px;
  border:1.5px solid #4caf50;
}
.q-card h2{color:#1b5e20;font-size:21px;margin-bottom:22px;line-height:1.6;}
.options{display:flex;flex-direction:column;gap:12px;}
.option-btn{
  padding:14px;
  border:2px solid #c8e6c9;
  border-radius:16px;
  background:#f1f8e9;
  cursor:pointer;
  font-size:16px;
  font-family:'Cairo',sans-serif;
  transition:0.2s;
  text-align:center;
}
.option-btn:hover{background:#dcedc8;border-color:#4caf50;transform:translateY(-2px);}
.option-btn.correct{background:#4caf50;color:white;border-color:#2e7d32;}
.option-btn.wrong{background:#e53935;color:white;border-color:#c62828;}
.result{margin-top:16px;font-size:18px;font-weight:bold;min-height:26px;}

/* شاشة فقدان القلب */
.life-lost-flash{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(229,57,53,0.15);
  pointer-events:none;
  z-index:5;
  animation:flashFade 0.6s ease-out;
}
@keyframes flashFade{0%{opacity:1;}100%{opacity:0;}}

/* شاشة النهاية */
.final-card{background:linear-gradient(135deg,#e8f5e9,#ffffff);border-radius:25px;padding:35px;box-shadow:0 8px 20px rgba(0,0,0,0.15);text-align:center;}
.final-score{font-size:44px;color:#1b5e20;margin:15px 0;}
.best-combo{color:#e65100;font-weight:bold;font-size:16px;margin-bottom:10px;}
.share-box{margin-top:20px;display:flex;justify-content:center;gap:15px;}
.share-box a{font-size:22px;color:white;width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:50%;text-decoration:none;}
.whatsapp{background:#25D366;}
.facebook{background:#1877f2;}
.copy{background:#4caf50;}
.restart-btn,.exit-btn{margin-top:15px;padding:13px 26px;border:none;border-radius:25px;cursor:pointer;font-size:16px;margin-inline:5px;font-weight:bold;}
.restart-btn{background:#1b5e20;color:white;}
.exit-btn{background:#e53935;color:white;}

@media(max-width:600px){header h1{font-size:26px;}.status-bar{justify-content:center;text-align:center;}}
</style>
</head>

<body>

<audio id="soundCorrect" src="correct.mp3"></audio>
<audio id="soundWrong" src="wrong.mp3"></audio>
<audio id="soundWin" src="win.mp3"></audio>
<audio id="soundLose" src="lose.mp3"></audio>

<header>
<h1>💚 نبض التحدي</h1>
<p>عندك 3 قلوب فقط... جاوب بسرعة قبل ما ينفد وقتك أو قلوبك!</p>
<nav class="nav">
<a href="games.html">🏠 عالم المعرفة</a>
<a href="fill.html">✍️ أكمل الآية</a>
<a href="puzzle.html">🧩رتّب الآية</a>
<a href="daily.html">💚 نبض التحدي</a>
</nav>
</header>

<div class="container">
  <div class="status-bar">
    <div class="hearts" id="hearts">❤️❤️❤️</div>
    <div class="combo-box" id="comboBox">🔥 كومبو 0</div>
    <div class="score-box">النقاط: <span id="score">0</span></div>
  </div>

  <div class="timebar-wrap"><div class="timebar" id="timebar"></div></div>

  <div class="q-card" id="quizCard"></div>
</div>

<script>
const siteLink = window.location.origin;
const soundCorrect=document.getElementById("soundCorrect");
const soundWrong=document.getElementById("soundWrong");
const soundWin=document.getElementById("soundWin");
const soundLose=document.getElementById("soundLose");

// بنك أسئلة متنوع ودقيق من كل أقسام الموقع
const bank=[
{cat:"الأذكار",q:"كم مرة يُستحب قول «سبحان الله» بعد الصلاة؟",options:["33 مرة","10 مرات","100 مرة","7 مرات"],answer:0},
{cat:"الأحاديث",q:"من راوي حديث «إنما الأعمال بالنيات»؟",options:["عمر بن الخطاب","أبو هريرة","ابن عباس","معاذ بن جبل"],answer:0},
{cat:"أسماء الله",q:"ما معنى اسم الله «الرزاق»؟",options:["الذي يرزق عباده","الذي يعلم كل شيء","الذي يغفر الذنوب","الذي يرحم"],answer:0},
{cat:"الأنبياء",q:"من النبي الذي التقمه الحوت؟",options:["يونس عليه السلام","يوسف عليه السلام","موسى عليه السلام","نوح عليه السلام"],answer:0},
{
    cat: "الأنبياء",
    q: "من هو النبي الذي أرسله الله تعالى إلى أهل مَدْيَن وكان يلقب بـ«خطيب الأنبياء» لفصاحته؟",
    options: ["شعيب عليه السلام", "هود عليه السلام", "صالح عليه السلام", "لوط عليه السلام"],
    answer: 0
  },
{cat:"الأنبياء",q:"من بنى الكعبة المشرّفة مع ابنه؟",options:["إبراهيم عليه السلام","نوح عليه السلام","آدم عليه السلام","موسى عليه السلام"],answer:0},
{cat:"الصحابة",q:"من أول من آمن بالنبي ﷺ من الرجال الأحرار؟",options:["أبو بكر الصديق","عمر بن الخطاب","علي بن أبي طالب","عثمان بن عفان"],answer:0},
{cat:"الأحاديث",q:"ما تكملة «الطهور شطر...»؟",options:["الإيمان","الصلاة","الدين","العبادة"],answer:0},
{cat:"أسماء الله",q:"ما معنى اسم الله «الغفور»؟",options:["الذي يغفر الذنوب","الذي يرزق","الذي يخلق","الذي يعلم"],answer:0},
{cat:"الأنبياء",q:"من النبي الذي كلّمه الله مباشرة عند جبل الطور؟",options:["موسى عليه السلام","عيسى عليه السلام","داود عليه السلام","سليمان عليه السلام"],answer:0},
{cat:"الصلاة",q:"كم عدد أركان الصلاة عند الشافعية؟",options:["14 ركناً","10 أركان","12 ركناً","20 ركناً"],answer:0},
{cat:"الأذكار",q:"ماذا يقول المسلم عند الاستيقاظ من النوم؟",options:["الحمد لله الذي أحيانا بعد ما أماتنا وإليه النشور","سبحان الله وبحمده","لا حول ولا قوة إلا بالله","أستغفر الله"],answer:0},
{cat:"الصحابة",q:"من لُقّب بـ«سيف الله المسلول»؟",options:["خالد بن الوليد","سعد بن أبي وقاص","الزبير بن العوام","طلحة بن عبيد الله"],answer:0},
{cat:"الأنبياء",q:"من النبي الذي وهبه الله صوتاً عذباً كانت الجبال تسبح معه؟",options:["داود عليه السلام","سليمان عليه السلام","يونس عليه السلام","زكريا عليه السلام"],answer:0},
{cat:"الأحاديث",q:"ما تكملة «المسلم من سلم المسلمون من...»؟",options:["لسانه ويده","قوله وفعله","نفسه وماله","دينه وعرضه"],answer:0},
{cat:"الصحابيات",q:"من لُقّبت بـ«ذات النطاقين»؟",options:["أسماء بنت أبي بكر","عائشة بنت أبي بكر","فاطمة الزهراء","خديجة بنت خويلد"],answer:0},
{cat:"الأنبياء",q:"من النبي الذي أُرسل إلى قوم ثمود؟",options:["صالح عليه السلام","هود عليه السلام","لوط عليه السلام","شعيب عليه السلام"],answer:0},
{cat:"الأذكار",q:"كم عدد مرات التسبيح والتحميد والتكبير مجتمعة بعد الصلاة (33+33+34)؟",options:["100 مرة","99 مرة","90 مرة","110 مرة"],answer:0},
{cat:"الأحاديث",q:"ما حكم حديث «تبسمك في وجه أخيك صدقة»؟",options:["حديث حسن رواه الترمذي","حديث موضوع","لا أصل له","حديث ضعيف جداً"],answer:0},
{cat:"أسماء الله",q:"ما معنى اسم الله «السلام»؟",options:["السالم من كل عيب ونقص في ذاته وصفاته وأفعاله","الذي يعطي السلامة فقط","القوي المتين","الحكيم العليم"],answer:0},
];

const START_LIVES=3;
const START_TIME=12; // ثانية للسؤال الواحد قبل التسريع
let questions=[],current=0,score=0,combo=0,bestCombo=0,lives=START_LIVES;
let timeLeft=START_TIME,timerInterval,tickInterval;

function shuffle(a){return a.sort(()=>Math.random()-0.5);}

function startGame(){
  questions=shuffle([...bank]);
  current=0;score=0;combo=0;bestCombo=0;lives=START_LIVES;
  updateHearts();
  updateCombo();
  document.getElementById("score").textContent=score;
  showQuestion();
}

function updateHearts(){
  let html="";
  for(let i=0;i<START_LIVES;i++){
    html += i<lives ? "❤️" : '<span class="heart-lost">🤍</span>';
  }
  document.getElementById("hearts").innerHTML=html;
}

function updateCombo(){
  const box=document.getElementById("comboBox");
  box.textContent="🔥 كومبو "+combo;
  if(combo>=3) box.classList.add("hot"); else box.classList.remove("hot");
}

function currentQuestionTime(){
  // كل ما زاد الكومبو، الوقت يصير أقصر (تحدي متصاعد)
  if(combo>=6) return 6;
  if(combo>=3) return 9;
  return START_TIME;
}

function renderCard(){
  document.getElementById("quizCard").innerHTML=`<div class="category-tag" id="cat"></div><h2 id="question"></h2><div class="options" id="options"></div><div class="result" id="result"></div>`;
}

function showQuestion(){
  if(current>=questions.length){endGame(true);return;}
  if(lives<=0){endGame(false);return;}

  renderCard();
  timeLeft=currentQuestionTime();
  updateTimebar(1);

  const q=questions[current];
  document.getElementById("cat").textContent="📂 "+q.cat;
  const shuffledOptions=q.options.map((o,i)=>({text:o,correct:i===q.answer}));
  shuffle(shuffledOptions);

  document.getElementById("question").textContent=q.q;
  const optDiv=document.getElementById("options");optDiv.innerHTML="";
  shuffledOptions.forEach(o=>{
    const b=document.createElement("button");
    b.textContent=o.text;b.className="option-btn";
    b.onclick=()=>checkAnswer(o.correct,b);
    optDiv.appendChild(b);
  });
  startTimer();
}

function updateTimebar(ratio){
  const bar=document.getElementById("timebar");
  bar.style.width=(ratio*100)+"%";
  if(ratio<=0.3) bar.classList.add("danger"); else bar.classList.remove("danger");
}

function startTimer(){
  clearInterval(timerInterval);clearInterval(tickInterval);
  const total=timeLeft;
  const startTs=Date.now();
  tickInterval=setInterval(()=>{
    const elapsed=(Date.now()-startTs)/1000;
    const remaining=Math.max(0,total-elapsed);
    updateTimebar(remaining/total);
    if(remaining<=0){
      clearInterval(tickInterval);
      checkAnswer(false,null);
    }
  },100);
}

function loseLife(){
  lives--;
  updateHearts();
  const flash=document.createElement("div");
  flash.className="life-lost-flash";
  document.body.appendChild(flash);
  setTimeout(()=>flash.remove(),600);
}

function checkAnswer(isCorrect,btnEl){
  clearInterval(timerInterval);clearInterval(tickInterval);
  const btns=document.querySelectorAll(".option-btn");
  btns.forEach(b=>b.disabled=true);

  if(isCorrect){
    if(btnEl) btnEl.classList.add("correct");
    combo++;
    if(combo>bestCombo) bestCombo=combo;
    const basePoints = combo>=6 ? 25 : combo>=3 ? 18 : 10;
    score+=basePoints;
    soundCorrect.play();
    document.getElementById("result").textContent = combo>=3 ? "🔥 صحيح! كومبو نار +"+basePoints : "✅ صحيح! +"+basePoints;
  }else{
    if(btnEl) btnEl.classList.add("wrong");
    // إظهار الإجابة الصحيحة
    const q=questions[current];
    const allBtns=document.querySelectorAll(".option-btn");
    allBtns.forEach(b=>{ if(b.textContent===q.options[q.answer]) b.classList.add("correct"); });
    combo=0;
    soundWrong.play();
    loseLife();
    document.getElementById("result").textContent="❌ إجابة خاطئة، فقدت قلباً!";
  }
  updateCombo();
  document.getElementById("score").textContent=score;
  setTimeout(()=>{current++;showQuestion();},1500);
}

function endGame(finishedAll){
  clearInterval(timerInterval);clearInterval(tickInterval);
  let msg="";
  if(finishedAll){
    msg="🌟 ما شاء الله! أنهيت كل الأسئلة ولقلبك باقي!";
    soundWin.play();
  }else{
    msg="💔 خسرت كل قلوبك! حاول تكسر رقمك القياسي المرة الجاية";
    soundLose.play();
  }

  document.getElementById("quizCard").innerHTML=`
  <div class="final-card">
    <h2>${finishedAll ? "🎉 نجحت بالتحدي!" : "💔 انتهى التحدي"}</h2>
    <div class="final-score">${score}</div>
    <div class="best-combo">🔥 أفضل كومبو: ${bestCombo}</div>
    <p>${msg}</p>
    <div class="share-box">
      <a class="whatsapp" target="_blank" href="https://wa.me/?text=حصلت على ${score} نقطة في نبض التحدي 💚 جربها: ${siteLink}"><i class="fab fa-whatsapp"></i></a>
      <a class="facebook" target="_blank" href="https://www.facebook.com/sharer/sharer.php?u=${siteLink}"><i class="fab fa-facebook-f"></i></a>
      <a class="copy" onclick="copyResult(${score})"><i class="fa fa-link"></i></a>
    </div>
    <div>
      <button class="restart-btn" onclick="startGame()">🔄 إعادة المحاولة</button>
      <button class="exit-btn" onclick="location.href='games.html'">🚪 الخروج للألعاب</button>
    </div>
  </div>`;
}

function copyResult(score){
  navigator.clipboard.writeText(`حصلت على ${score} نقطة في نبض التحدي 💚 جربها الآن: ${siteLink}`);
  alert("تم النسخ ✔");
}

startGame();
</script>

</body>
</html>
